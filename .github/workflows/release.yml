name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build extension (required for integration tests)
        run: pnpm run build:extension

      - name: Install VS Code headless dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb \
            libnspr4 libnss3 \
            libatk1.0-0 libatk-bridge2.0-0 \
            libgtk-3-0 libglib2.0-0 \
            libgbm1 libxkbcommon0 \
            libasound2t64

      - name: Integration tests
        run: xvfb-run -a pnpm run test:integration

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Package extension
        run: pnpm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "releases/*.vsix"
          generate_release_notes: true

      - name: Publish to Open VSX
        run: pnpm exec ovsx publish releases/*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
